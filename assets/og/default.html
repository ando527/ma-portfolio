<!doctype html>
<!--
  Default share card, 1200 × 630. Rendered to assets/og/default.png by
  `npm run og` (scripts/make-og-cards.mjs), then to public/images/og/default.jpg
  by `npm run images`. Graphite ground, the portrait on one solid maroon block,
  Geist and Geist Mono from assets/fonts.
-->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Geist; src: url(../fonts/geist-latin.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono'; src: url(../fonts/geist-mono-latin.woff2) format('woff2'); font-weight: 100 900; }

  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #161513; color: #EFE9DE; font-family: Geist, sans-serif; -webkit-font-smoothing: antialiased; }

  .block { position: absolute; top: 0; right: 0; bottom: 0; width: 560px; background: #7C1D2E; }
  .photo { position: absolute; right: 20px; bottom: 0; height: 600px; width: 600px; }

  .text { position: absolute; left: 72px; top: 56px; bottom: 144px; width: 580px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 22px; line-height: 28px; color: #918B81; }
  h1 { margin: 24px 0 0; font-weight: 500; font-size: 104px; line-height: 1.04; letter-spacing: -0.03em; }
  p { margin: 32px 0 0; max-width: 500px; font-size: 30px; line-height: 40px; color: #AAA398; }
  .url { position: absolute; left: 72px; bottom: 72px; font-family: 'Geist Mono', monospace; font-size: 22px; line-height: 28px; color: #918B81; }
</style></head>
<body>
  <div class="block"></div>
  <img class="photo" src="../images/hero.png" alt="">
  <div class="text">
    <div class="eyebrow">Web developer in Brisbane</div>
    <h1>Mitchell<br>Anderson</h1>
    <p>Websites in Webflow, Shopify and Next.js, from wireframe to launch.</p>
  </div>
  <div class="url">mitchellanderson.com.au</div>
</body></html>
